services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-earmark}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:-earmark}
    ports:
      - '127.0.0.1:${DATABASE_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-earmark}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
